name: Build & Release Windows Binaries & Portable ZIP

on:
  release:
    types: [created, published]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller onnx onnxruntime onnxslim
          pip install -r requirements.txt

      - name: Build Standalone Windows .exe with ONNX Neural Acceleration
        run: |
          pyinstaller --clean --noconfirm tracex.spec

      - name: Create Complete Portable ZIP Bundle
        run: |
          powershell -Command "Compress-Archive -Path run_tracex.bat, main.py, requirements.txt, backend, dist\TraceX-DVR-Forensics.exe -DestinationPath dist\TraceX-DVR-Forensics-v1.0.0-Portable.zip -Force"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TraceX-DVR-Forensics-Distributions
          path: |
            dist/TraceX-DVR-Forensics.exe
            dist/TraceX-DVR-Forensics-v1.0.0-Portable.zip

      - name: Upload Binaries to GitHub Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TraceX-DVR-Forensics.exe
            dist/TraceX-DVR-Forensics-v1.0.0-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
