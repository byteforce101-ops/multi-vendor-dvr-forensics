name: Build & Release Windows Standalone Executable

on:
  release:
    types: [created, published]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Standalone Windows .exe
        run: |
          pyinstaller --clean --noconfirm tracex.spec

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraceX-DVR-Forensics-Windows
          path: dist/TraceX-DVR-Forensics.exe

      - name: Upload .exe to GitHub Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TraceX-DVR-Forensics.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
